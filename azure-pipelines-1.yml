trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: NodeTool@0
    displayName: Install Node.js 22
    inputs:
      versionSpec: "22.x"

  - script: |
      npm ci
      npm test
    displayName: Validate application

  - task: Docker@2
    displayName: Build container image
    inputs:
      command: build
      Dockerfile: $(Build.SourcesDirectory)/Dockerfile
      buildContext: $(Build.SourcesDirectory)
      tags: |
        atelier-ecommerce:validation
