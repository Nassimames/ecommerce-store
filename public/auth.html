<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mon compte — Atelier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body data-page="auth">
    <header class="site-header">
      <a class="brand" href="/">atelier<span>.</span></a>
      <nav class="main-nav" aria-label="Navigation principale"><a href="/#boutique">La boutique</a><a href="/#histoire">Notre histoire</a></nav>
      <div class="header-actions"><a class="account-link" href="/auth.html" data-account-link>Mon compte</a><a class="cart-link" href="/cart.html">Panier <span class="cart-count" data-cart-count>0</span></a></div>
    </header>
    <main class="auth-wrap">
      <section class="auth-card">
        <p class="eyebrow">BIENVENUE CHEZ ATELIER</p>
        <h1 data-auth-title>Ravi de vous revoir.</h1>
        <form class="auth-form" data-auth-form>
          <label class="register-only" hidden for="name">Votre nom</label>
          <input class="register-only" hidden id="name" name="name" type="text" autocomplete="name" minlength="2" maxlength="80" placeholder="Votre nom">
          <label for="email">Adresse e-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="vous@exemple.fr">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="8 caractères minimum">
          <button class="button button-dark button-full" type="submit" data-auth-submit>Se connecter</button>
        </form>
        <p class="notice" data-message role="status" aria-live="polite"></p>
        <button class="mode-switch" type="button" data-auth-switch>Créer un compte</button>
      </section>
    </main>
    <footer class="site-footer"><a class="brand brand-light" href="/">atelier<span>.</span></a><p>Des objets choisis pour le quotidien.</p><span>© <span data-year></span> Atelier — Avec soin, en France.</span></footer>
  </body>
</html>
